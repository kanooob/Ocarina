Summary: Open-source internet radio player, live streaming, and DLNA broadcasting
Description: |-
 Ocarina is an internet radio player that is 100% free software, licensed under the GNU GPLv3,
designed for a smooth, distraction-free music listening experience on Android.
  Fonctionnalités :
  * Direct streaming of Icecast, Shoutcast, HLS (.m3u8), RTSP, and DASH feeds
  * Integrated open-source Radio Browser directory with over 40,000 stations
  * Live metadata extraction (title, artist via Icy-MetaData)
  * Dynamic, high-resolution album art in real time
  * Wireless streaming via DLNA/UPnP to connected speakers, TVs, and amplifiers
  * Physical DLNA volume control using smartphone buttons
  * Persistent counter for cumulative listening time
  * Home screen widgets (circular button and adaptive player)
  * Exporting and importing full backups in JSON format
  * Zero trackers, zero ads, no account required, zero proprietary services

  Mention Anti-Features :
  * NonFreeNet : The application enables the playback—with optional audio—of live streams from proprietary network platforms (YouTube and Twitch).

