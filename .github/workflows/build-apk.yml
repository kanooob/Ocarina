name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle & Build APK
        run: |
          # Installe l'outil Gradle sur le serveur de build s'il n'est pas présent
          sudo apt-get update && sudo apt-get install -y gradle
          
          # Si le fichier gradlew n'existe pas, on le crée automatiquement
          if [ ! -f "gradlew" ]; then
            echo "Création du wrapper Gradle manquant..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/app-debug.apk
