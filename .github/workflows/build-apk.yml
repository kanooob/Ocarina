name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Build Debug APK
        run: |
          # Recherche automatique du fichier gradlew dans le projet et execution
          find . -name "gradlew" -exec chmod +x {} \;
          ./gradlew assembleDebug || find . -name "gradlew" -execdir ./gradlew assembleDebug \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
