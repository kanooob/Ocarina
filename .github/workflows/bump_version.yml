name: "Changement de Version (Bump Version)"

# Ce workflow s'affiche directement dans l'onglet "Actions" de GitHub.
# Il permet de changer et d'incrémenter le numéro de version de l'application
# de façon entièrement automatisée à tous les endroits du code :
#  1. app/build.gradle.kts (versionCode & versionName)
#  2. .fdroid.yml (entrée de build F-Droid)
#  3. metadata/fr.galaxie.ocarina.yml (métadonnées F-Droid officielles)
#  4. app/src/main/java/com/example/ui/Localization.kt (labels d'affichage FR & EN)
#  5. app/src/test/java/com/example/ExampleRobolectricTest.kt (tests unitaires de version)
#  6. fastlane/metadata/android/{fr-FR,en-US}/changelogs/ (notes de version)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Numéro de build Android (versionCode, ex: 214 ou 'auto' pour incrémenter de +1)"
        required: true
        default: "auto"
        type: string
      version_name:
        description: "Nom de version (versionName, ex: 214 ou 2.1.4, ou 'auto' pour suivre le build)"
        required: false
        default: "auto"
        type: string
      display_version:
        description: "Version affichée dans les paramètres de l'app (ex: 2.1.4 ou 'auto')"
        required: false
        default: "auto"
        type: string
      create_tag:
        description: "Créer et pousser automatiquement le tag Git (ex: v214)"
        required: false
        default: true
        type: boolean
      create_release:
        description: "Créer une Release GitHub officielle"
        required: false
        default: false
        type: boolean
      changelog_fr:
        description: "Notes de version en Français (Fastlane & F-Droid)"
        required: false
        default: ""
        type: string
      changelog_en:
        description: "Release notes in English (Fastlane & F-Droid)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump_version:
    name: "Mise à jour automatique de version"
    runs-on: ubuntu-latest

    steps:
      - name: "Cloner le dépôt"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Configurer Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Configurer Java JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Configurer Gradle"
        uses: gradle/actions/setup-gradle@v4

      - name: "Exécuter le script de mise à jour des versions"
        id: bump
        run: |
          chmod +x ./scripts/bump_version.py
          python3 ./scripts/bump_version.py \
            --code "${{ github.event.inputs.version_code }}" \
            --name "${{ github.event.inputs.version_name }}" \
            --display "${{ github.event.inputs.display_version }}" \
            --changelog-fr "${{ github.event.inputs.changelog_fr }}" \
            --changelog-en "${{ github.event.inputs.changelog_en }}"

      - name: "Vérifier la compilation et les tests unitaires"
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew testDebugUnitTest
          else
            gradle testDebugUnitTest
          fi

      - name: "Configurer Git"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "Commiter et Pousser les modifications"
        run: |
          git add app/build.gradle.kts \
                  .fdroid.yml \
                  metadata/fr.galaxie.ocarina.yml \
                  app/src/main/java/com/example/ui/Localization.kt \
                  app/src/test/java/com/example/ExampleRobolectricTest.kt \
                  fastlane/

          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version_code }} (${{ steps.bump.outputs.display_version }}) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: "Créer et Pousser le Tag Git"
        if: ${{ github.event.inputs.create_tag == 'true' }}
        run: |
          TAG="${{ steps.bump.outputs.commit_tag }}"
          echo "Création du tag $TAG..."
          git tag -a "$TAG" -m "Release $TAG (${{ steps.bump.outputs.display_version }})"
          git push origin "$TAG"

      - name: "Créer la GitHub Release"
        if: ${{ github.event.inputs.create_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.bump.outputs.commit_tag }}"
          TITLE="Ocarina $TAG (${{ steps.bump.outputs.display_version }})"
          NOTES="${{ github.event.inputs.changelog_fr }}"
          if [ -z "$NOTES" ]; then
            NOTES="${{ github.event.inputs.changelog_en }}"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Mise à jour automatique de version vers $TAG."
          fi
          gh release create "$TAG" --title "$TITLE" --notes "$NOTES"

      - name: "Générer le résumé du Job (Step Summary)"
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 Mise à jour de version effectuée avec succès !

          | Propriété | Ancienne valeur | Nouvelle valeur |
          |---|---|---|
          | **versionCode** | `${{ steps.bump.outputs.previous_code }}` | **`${{ steps.bump.outputs.version_code }}`** |
          | **versionName** | `${{ steps.bump.outputs.previous_name }}` | **`${{ steps.bump.outputs.version_name }}`** |
          | **Version affichée** | — | **`${{ steps.bump.outputs.display_version }}`** |
          | **Tag Git** | — | **`${{ steps.bump.outputs.commit_tag }}`** |

          ### 📁 Fichiers synchronisés :
          - `app/build.gradle.kts` : `versionCode` et `versionName` mis à jour
          - `.fdroid.yml` : Entrée ajoutée dans `Builds:`
          - `metadata/fr.galaxie.ocarina.yml` : Entrée de build ajoutée
          - `app/src/main/java/com/example/ui/Localization.kt` : Chaînes `appVersionLabel` (FR & EN) actualisées
          - `app/src/test/java/com/example/ExampleRobolectricTest.kt` : Tests unitaires synchronisés et validés

          Tests unitaires Robolectric passés avec succès ✅
          EOF
